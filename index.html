<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC2 Web Server</title>
    <style>
        :root {
            --primary: #232f3e; /* AWS Dark Blue */
            --accent: #ff9900;  /* AWS Orange */
            --bg: #f4f6f9;
            --text: #333333;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 90%;
            text-align: center;
            border-top: 5px solid var(--accent);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .status-badge {
            display: inline-block;
            background-color: #e6f4ea;
            color: #137333;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚀</div>
        <h1>Deployment Successful!</h1>
        <p>Your HTML website is now live, hosted on an Apache (httpd) web server via Amazon EC2, and continuously deployed using GitHub Actions.</p>
        <span class="status-badge">● Server Active</span>
        
        <footer>
            Built automatically with GitHub Actions
        </footer>
    </div>

</body>
</html>
