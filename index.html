<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Console Node</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #38bdf8;
            --neon-purple: #a855f7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            margin: 0;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Glowing background decorative blobs */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: var(--neon-purple);
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        .header {
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--neon-blue);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 1rem 0 0.5rem 0;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 1rem;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.03);
        }

        .stat-val {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .action-btn {
            background: #fff;
            color: #0f172a;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(0.99);
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--glass-border);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="content-wrapper">
            <div class="header">
                <div class="badge">
                    <span style="color: #10b981;">●</span> Node Active
                </div>
                <h1>EC2 instances online</h1>
                <p class="subtitle">Continuous integration pipeline successfully finished processing. Apache HTTP server running live production build.</p>
            </div>

            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-val" style="color: var(--neon-blue);">200</div>
                    <div class="stat-label">Status</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val">AWS</div>
                    <div class="stat-label">Host</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" style="color: var(--neon-purple);">v1.2.0</div>
                    <div class="stat-label">Build</div>
                </div>
            </div>

            <button class="action-btn" onclick="refreshStatus()">Ping Infrastructure</button>

            <div class="footer">
                Pipeline execution verified: <span id="time-display"></span>
            </div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time-display').innerText = now.toLocaleTimeString();
        }
        
        function refreshStatus() {
            const btn = document.querySelector('.action-btn');
            btn.innerText = 'Pinging...';
            btn.style.opacity = '0.7';
            setTimeout(() => {
                btn.innerText = 'Node Responsive ✓';
                btn.style.background = '#10b981';
                btn.style.color = '#fff';
                updateTime();
                setTimeout(() => {
                    btn.innerText = 'Ping Infrastructure';
                    btn.style.background = '#fff';
                    btn.style.color = '#0f172a';
                }, 2000);
            }, 800);
        }

        updateTime();
    </script>
</body>
</html>
